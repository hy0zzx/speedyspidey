<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SPEEDY SPIDEY</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="450"></canvas>
        <div id="ui-layer">
            <div class="score-text">DISTANCE: <span id="dist-val">0</span>m</div>
            <div class="score-text">COINS: <span id="coin-val">0</span></div>
        </div>
        <div id="start-screen" class="overlay">
            <h1>AVENGERS RUN</h1>
            <p>클릭하여 도시를 가로지르세요</p>
            <p class="help-text">점프: 클릭 | 로프/웹: 크레인 부근에서 클릭 유지</p>

            <button id="start-btn" style="position: relative; z-index: 100;">GAME START</button>
        </div>
        <div id="game-over-screen" class="overlay" style="display: none;">
            <h1>GAME OVER</h1>
            <p>이동 거리: <span id="final-dist">0</span>m</p>
            <p>획득 동전: <span id="final-coins">0</span></p>
            <button id="restart-btn">RESTART</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const distVal = document.getElementById('dist-val');
        const coinVal = document.getElementById('coin-val');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');

        const victoryScreenDiv = document.createElement('div');
        victoryScreenDiv.className = 'overlay victory';
        victoryScreenDiv.style.display = 'none';
        victoryScreenDiv.innerHTML = `
            <h1>GAME CLEAR!</h1>
            <p>MJ와 무사히 만났습니다!</p>
            <p style="font-size: 20px;">이동 거리: <span id="victory-dist">0</span>m | 획득 동전: <span id="victory-coins">0</span></p>
            
            <div id="ranking-input-section">
                <input type="text" id="nickname-input" placeholder="닉네임 입력 (최대 8자)" maxlength="8">
                <button id="submit-rank-btn" style="font-size: 18px; margin: 0; padding: 10px 20px;">기록 등록</button>
            </div>
            
            <div id="ranking-board-section" style="display: none;">
                <h2>🏆 랭킹보드 (코인순) 🏆</h2>
                <ul id="ranking-list"></ul>
            </div>

            <button id="victory-restart-btn">RESTART</button>
        `;
        document.getElementById('game-container').appendChild(victoryScreenDiv);

        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');

        const CANVAS_W = 800;
        const CANVAS_H = 450;
        const GRAVITY = 0.65;
        const JUMP_POWER = -12.5;

        let gameState = 'MENU';
        let distanceTracker = 0;
        let coinsCollected = 0;
        let frameCount = 0;
        let speedX = 8;
        let cameraX = 0;
        let animationId;

        let lastTime = 0;
        let accumulator = 0;
        const TIME_STEP = 1000 / 60;

        let mj = null;

        let player = {
            x: 0, y: 0,
            vx: 0, vy: 0,
            state: 'run',
            anchor: null,
            length: 0
        };

        let roofs = [];
        let coins = [];
        let anchors = []; // Cranes that Spiderman can swing from
        let stars = [];
        let bgBuildings = [];
        let midBuildings = [];

        function initMenu() {
            distanceTracker = 0;
            coinsCollected = 0;
            frameCount = 0;
            speedX = 8;
            cameraX = 0;

            player = { x: 200, y: 350, vx: 0, vy: 0, state: 'run', anchor: null, length: 0 };
            mj = null;

            roofs = [{ x: 0, y: 350, w: 2000 }];
            coins = [];
            anchors = [];

            // Generate Stars
            stars = [];
            for (let i = 0; i < 50; i++) {
                stars.push({
                    x: Math.random() * CANVAS_W,
                    y: Math.random() * 250,
                    size: Math.random() * 2,
                    blinkSpeed: 0.02 + Math.random() * 0.05
                });
            }

            // Generate Background City
            bgBuildings = [];
            midBuildings = [];
            for (let i = 0; i < 30; i++) {
                bgBuildings.push(createBuildingNode(0.1, 150));
            }
            for (let i = 0; i < 20; i++) {
                midBuildings.push(createBuildingNode(0.3, 250));
            }

            draw();
        }

        function createBuildingNode(parallax, maxH) {
            let hasWindows = Math.random() > 0.3;
            let windows = [];
            let w = 60 + Math.random() * 120;
            let h = 100 + Math.random() * maxH;

            if (hasWindows) {
                for (let wy = 20; wy < h - 20; wy += 25) {
                    for (let wx = 10; wx < w - 20; wx += 20) {
                        if (Math.random() > 0.4) {
                            windows.push({ x: wx, y: wy, color: Math.random() > 0.8 ? '#f1c40f' : '#fdf5e6' });
                        }
                    }
                }
            }
            return {
                x: Math.random() * 2000,
                w: w, h: h,
                hasWindows, windows,
                color: parallax === 0.1 ? '#0a0a1a' : '#14142a'
            };
        }

        function startGame() {
            initMenu();
            gameState = 'PLAYING';
            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
            victoryScreenDiv.style.display = 'none';
            player.vx = speedX;
            updateUI();
            if (animationId) cancelAnimationFrame(animationId);
            lastTime = performance.now();
            accumulator = 0;
            animationId = requestAnimationFrame(gameLoop);
        }

        function triggerVictory() {
            gameState = 'VICTORY';
            document.getElementById('victory-dist').innerText = Math.floor(distanceTracker / 50);
            document.getElementById('victory-coins').innerText = coinsCollected;
            
            document.getElementById('nickname-input').value = '';
            document.getElementById('ranking-input-section').style.display = 'flex';
            document.getElementById('ranking-board-section').style.display = 'none';

            victoryScreenDiv.style.display = 'flex';
        }

        document.getElementById('submit-rank-btn').addEventListener('click', () => {
            const nickname = document.getElementById('nickname-input').value.trim() || '익명';
            let rankings = JSON.parse(localStorage.getItem('speedy_rankings') || '[]');
            
            rankings.push({ 
                name: nickname, 
                coins: coinsCollected, 
                dist: Math.floor(distanceTracker / 50) 
            });
            
            rankings.sort((a, b) => b.coins - a.coins);
            rankings = rankings.slice(0, 5); // Keep top 5
            
            localStorage.setItem('speedy_rankings', JSON.stringify(rankings));
            showRankingBoard();
        });

        function showRankingBoard() {
            document.getElementById('ranking-input-section').style.display = 'none';
            document.getElementById('ranking-board-section').style.display = 'block';
            
            const ul = document.getElementById('ranking-list');
            ul.innerHTML = '';
            let rankings = JSON.parse(localStorage.getItem('speedy_rankings') || '[]');
            
            rankings.forEach((r, idx) => {
                let li = document.createElement('li');
                li.innerText = `${idx + 1}위: ${r.name} - 💰${r.coins} (${r.dist}m)`;
                ul.appendChild(li);
            });
        }

        document.getElementById('victory-restart-btn').addEventListener('click', startGame);

        function gameOver() {
            gameState = 'GAMEOVER';
            document.getElementById('final-dist').innerText = Math.floor(distanceTracker / 50);
            document.getElementById('final-coins').innerText = coinsCollected;
            gameOverScreen.style.display = 'flex';
        }

        function updateUI() {
            distVal.innerText = Math.floor(distanceTracker / 50);
            coinVal.innerText = coinsCollected;
        }

        function handleDown(e) {
            if (e && e.target && e.target.tagName === 'BUTTON') return;
            if (gameState !== 'PLAYING') return;

            if (player.state === 'run') {
                player.vy = JUMP_POWER;
                player.state = 'jump';
                player.y -= 2;
            } else if ((player.state === 'jump' || player.state === 'fall') && !player.anchor) {
                // Find nearest valid anchor point ahead of player
                let validAnchor = null;
                let minDist = Infinity;

                for (let a of anchors) {
                    // Anchor must be ahead of player
                    if (a.x > player.x + 20) {
                        let dx = a.x - player.x;
                        let dy = a.y - player.y;
                        let dist = Math.sqrt(dx * dx + dy * dy);
                        // Limit distance to 400
                        if (dist < minDist && dist < 400) {
                            minDist = dist;
                            validAnchor = a;
                        }
                    }
                }

                if (validAnchor) {
                    player.state = 'swing';
                    player.anchor = { x: validAnchor.x, y: validAnchor.y };
                    player.length = minDist;
                } else {
                    player.failedWeb = { x: player.x + 300, y: player.y - 200, timer: 15 };
                }
                // If no anchor found, player just continues falling.
            }
        }

        function handleUp(e) {
            if (e && e.target && e.target.tagName === 'BUTTON') return;
            if (player.state === 'swing') {
                player.state = 'jump';
                player.anchor = null;
                player.vy = Math.min(player.vy, -2);
            }
        }

        canvas.addEventListener('mousedown', handleDown);
        canvas.addEventListener('mouseup', handleUp);
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleDown(e); }, { passive: false });
        canvas.addEventListener('touchend', (e) => { e.preventDefault(); handleUp(e); }, { passive: false });

        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);

        function generateWorld() {
            let lastRoof = roofs[roofs.length - 1];

            if (distanceTracker >= 30000 && !roofs.some(r => r.isEnding)) {
                let rx = lastRoof.x + lastRoof.w + 400;
                let newY = 300;
                roofs.push({ x: rx, y: newY, w: 2000, isEnding: true, acUnits: [], windows: [] });
                anchors.push({ x: lastRoof.x + lastRoof.w + 200, y: 0 });
                mj = { x: rx + 1000, y: newY, vx: 0, state: 'idle' };
                return;
            }
            if (lastRoof && lastRoof.isEnding) return;

            if (lastRoof.x - cameraX < CANVAS_W * 2) {
                let difficulty = Math.min(distanceTracker / 30000, 1);

                let isGap = false;
                if (difficulty < 0.3) {
                    isGap = Math.random() > 0.4;
                } else if (difficulty < 0.7) {
                    isGap = Math.random() > 0.3;
                } else {
                    isGap = Math.random() > 0.1;
                }

                let gapMin = 150 + difficulty * 150;
                let gapMax = 250 + difficulty * 350;
                let gap = isGap ? gapMin + Math.random() * (gapMax - gapMin) : 0;

                let widthMin = 200;
                let widthMax = 600 - difficulty * 150;
                let width = Math.max(widthMin + Math.random() * (widthMax - widthMin), 150);

                let newY;
                if (isGap) {
                    let yDelta = (Math.random() - 0.5) * (100 + difficulty * 100);
                    newY = lastRoof.y + yDelta;
                    if (newY < 200) newY = 200;
                    if (newY > 400) newY = 400;
                } else {
                    newY = lastRoof.y;
                }

                let rx = lastRoof.x + lastRoof.w + gap;

                let acUnits = [];
                for (let i = 0; i < width / 150; i++) {
                    if (Math.random() > 0.5) acUnits.push({ x: 20 + Math.random() * (width - 60), w: 30 + Math.random() * 20, h: 10 + Math.random() * 15 });
                }

                let windows = [];
                for (let wy = newY + 40; wy < CANVAS_H; wy += 50) {
                    for (let wx = 20; wx < width - 20; wx += 40) {
                        if (Math.random() > 0.8) windows.push({ x: wx, y: wy - newY, color: '#f1c40f' });
                    }
                }

                roofs.push({ x: rx, y: newY, w: width, acUnits, windows });

                // If there's a gap, spawn an Anchor (Crane) in the middle of the gap
                if (isGap) {
                    let anchorX = lastRoof.x + lastRoof.w + (gap * 0.6);
                    let anchorY = -50 + (Math.random() * 50); // High up in the sky
                    anchors.push({ x: anchorX, y: anchorY });

                    // Spawn Arc Coins leading towards the gap and over it, guiding the swing
                    let span = gap + 150;

                    // We simulate the swing path. 
                    // Assume the player jumps first, so they are higher and further out
                    let startX = lastRoof.x + lastRoof.w + 50;
                    let startY = lastRoof.y - 80;

                    let dxStart = startX - anchorX;
                    let dyStart = startY - anchorY;
                    let radius = Math.sqrt(dxStart * dxStart + dyStart * dyStart);
                    let startAngle = Math.atan2(dyStart, dxStart);

                    // The end of the gap is rx. We want the swing to take us past rx.
                    let endX = rx + 50;
                    let dxEnd = endX - anchorX;
                    // Because it's a pendulum swinging forward, the angle goes from something like 160 deg to 20 deg
                    let endAngle = Math.atan2(Math.abs(dyStart), dxEnd);
                    // Make sure endAngle is smaller than startAngle since we are swinging right (clockwise-ish in canvas coords? Actually in canvas +y is down)
                    // At start: dx is negative, dy is positive -> Angle is ~ 2.0 rad
                    // At end: dx is positive, dy is positive -> Angle is ~ 1.1 rad

                    let arcLength = radius * Math.abs(endAngle - startAngle);
                    let numArcCoins = Math.floor(arcLength / 40);
                    if (numArcCoins < 1) numArcCoins = 1;

                    for (let i = 1; i <= numArcCoins; i++) {
                        let pct = i / (numArcCoins + 1);
                        // Interpolate angle
                        let currentAngle = startAngle + (endAngle - startAngle) * pct;

                        let cx = anchorX + Math.cos(currentAngle) * radius;
                        let cy = anchorY + Math.sin(currentAngle) * radius;

                        coins.push({
                            x: cx, y: cy,
                            type: Math.random() > 0.9 ? 'gold' : 'silver',
                            collected: false
                        });
                    }
                }

                // Spawn Continuous Coins on the roof
                let coinSpacing = 40;
                let numCoins = Math.floor((width - 100) / coinSpacing);
                for (let i = 0; i < numCoins; i++) {
                    coins.push({
                        x: rx + 50 + i * coinSpacing,
                        y: newY - 25,
                        type: Math.random() > 0.95 ? 'gold' : 'silver',
                        collected: false
                    });
                }
            }

            // Clean up old objects
            if (roofs.length > 2 && roofs[0].x + roofs[0].w < cameraX - 200) roofs.shift();
            anchors = anchors.filter(a => a.x > cameraX - 200);
            coins = coins.filter(c => !c.collected && c.x > cameraX - 100);
        }

        function gameLoop(timestamp) {
            if (gameState === 'MENU' || gameState === 'GAMEOVER') return;

            if (!lastTime) lastTime = timestamp;
            let dt = timestamp - lastTime;
            lastTime = timestamp;

            if (dt > 100) dt = 100; // Cap to prevent huge jumps

            accumulator += dt;
            while (accumulator >= TIME_STEP) {
                updatePhysics();
                accumulator -= TIME_STEP;
                if (gameState === 'MENU' || gameState === 'GAMEOVER') break;
            }

            draw();
            if (gameState !== 'MENU' && gameState !== 'GAMEOVER') {
                animationId = requestAnimationFrame(gameLoop);
            }
        }

        function updatePhysics() {
            frameCount++;

            if (gameState === 'PLAYING') {
                speedX = 8 + Math.min(distanceTracker / 6000, 8);

                if (player.state === 'run') {
                    player.vx = speedX;
                    player.vy = 0;
                } else {
                    player.vy += GRAVITY;
                }
            } else if (gameState === 'OUTRO') {
                if (mj && player.x + 40 >= mj.x) {
                    player.vx = 0;
                    mj.vx = 0;
                    player.state = 'idle';
                    mj.state = 'idle';
                    
                    if (!player.victoryTimer) player.victoryTimer = 0;
                    player.victoryTimer++;
                    if (player.victoryTimer > 60 && gameState !== 'VICTORY') {
                        triggerVictory();
                    }
                } else {
                    player.vx = 4;
                    player.vy = 0;
                    player.state = 'run';
                    if (mj) {
                        mj.state = 'run';
                        mj.vx = -3;
                        mj.x += mj.vx;
                    }
                }
            } else if (gameState === 'VICTORY') {
                player.vx = 0;
                player.vy = 0;
                player.state = 'idle';
                if (mj) {
                    mj.vx = 0;
                    mj.state = 'idle';
                }
            }

            player.x += player.vx;
            player.y += player.vy;
            distanceTracker += player.vx;

            if (player.failedWeb && player.failedWeb.timer > 0) {
                player.failedWeb.timer--;
            }

            // 천장 화면 밖으로 올라가지 못하게 막기 (화면 상단 약간 위까지만 허용)
            if (player.y < -50) {
                player.y = -50;
                if (player.vy < 0) player.vy = 0;
            }

            if (player.state === 'swing') {
                let dx = player.x - player.anchor.x;
                let dy = player.y - player.anchor.y;
                let dist = Math.sqrt(dx * dx + dy * dy);

                if (dist > player.length) {
                    let diff = dist - player.length;
                    player.x -= (dx / dist) * diff;
                    player.y -= (dy / dist) * diff;

                    let dot = (player.vx * dx + player.vy * dy) / dist;
                    player.vx -= (dx / dist) * dot;
                    player.vy -= (dy / dist) * dot;
                }
                player.vx += 0.2;

                // 강제로 속도감 유지 (원래 달리는 속도보다 느려지지 않게 방지)
                if (player.vx < speedX) {
                    player.vx = speedX;
                }
            }

            let onRoof = false;
            for (let r of roofs) {
                if (player.x + 10 > r.x && player.x - 10 < r.x + r.w) {
                    if (player.vy >= 0 && player.y >= r.y - 15 && player.y - player.vy <= r.y + 15) {
                        player.y = r.y;
                        player.vy = 0;
                        if (player.state !== 'swing') {
                            player.state = 'run';
                            player.vx = speedX;
                        }
                        onRoof = true;
                    }
                }
                if ((player.state === 'fall' || player.state === 'jump') && !onRoof) {
                    if (player.x + 15 >= r.x && player.x - 15 <= r.x + 15 && player.y > r.y + 10) {
                        player.vx = 0;
                    }
                }
            }

            if (gameState === 'PLAYING' && mj && player.x > mj.x - 600 && onRoof) {
                gameState = 'OUTRO';
                player.y = roofs.find(r => r.isEnding).y;
            }

            if (!onRoof && (player.state === 'run' || player.state === 'idle')) {
                player.state = 'fall';
            }

            if (gameState === 'PLAYING') {
                for (let c of coins) {
                    if (!c.collected) {
                        let dx = player.x - c.x;
                        let dy = (player.y - 20) - c.y;
                        if (dx * dx + dy * dy < 1000) {
                            c.collected = true;
                            coinsCollected += c.type === 'gold' ? 30 : 10;
                        }
                    }
                }
            }

            let targetCameraX;
            if (gameState === 'OUTRO' || gameState === 'VICTORY') {
                if (mj) {
                    targetCameraX = player.x + (mj.x - player.x) / 2 - CANVAS_W / 2;
                } else {
                    targetCameraX = player.x - 200;
                }
            } else {
                targetCameraX = player.x - 200;
            }
            // Smoothly ease camera
            cameraX += (targetCameraX - cameraX) * 0.05;

            if (gameState !== 'VICTORY' && gameState !== 'OUTRO') {
                generateWorld();
            }

            if ((player.y > CANVAS_H + 50 || player.x < cameraX - 50) && gameState === 'PLAYING') {
                gameOver();
                return;
            }

            if (frameCount % 5 === 0) updateUI();
        }

        function drawCharacter(x, y, state, frame) {
            ctx.save();
            ctx.translate(x, y);

            ctx.scale(0.8, 0.8);

            // Spidey Colors
            let primary = '#e23636', secondary = '#1d3557', tetherSrc = '#fff';

            // Web/Tether line from wrist if swinging
            if (state === 'swing' && player.anchor) {
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(15, -20); // Wrist
                let sFactor = 0.8;
                let relX = player.anchor.x - x;
                let relY = player.anchor.y - y;
                ctx.lineTo(relX / sFactor, relY / sFactor);
                ctx.strokeStyle = tetherSrc;
                ctx.lineWidth = 2;
                ctx.globalAlpha = 0.8;
                ctx.stroke();
                ctx.restore();
            } else if (player.failedWeb && player.failedWeb.timer > 0) {
                // Failed web visual
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(15, -20); // Wrist
                let sFactor = 0.8;
                let relX = player.failedWeb.x - x;
                let relY = player.failedWeb.y - y;
                let pct = (15 - player.failedWeb.timer) / 15; // 0 to 1
                ctx.lineTo((relX / sFactor) * pct, (relY / sFactor) * pct);
                ctx.strokeStyle = tetherSrc;
                ctx.lineWidth = 2;
                ctx.globalAlpha = player.failedWeb.timer / 15;
                ctx.stroke();
                ctx.restore();
            }

            // Spidey Mask
            ctx.fillStyle = primary;
            ctx.beginPath(); ctx.arc(0, -30, 15, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#fff'; ctx.strokeStyle = '#000'; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(-2, -37); ctx.quadraticCurveTo(-10, -38, -12, -32); ctx.quadraticCurveTo(-8, -28, -2, -30); ctx.closePath(); ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(8, -37); ctx.quadraticCurveTo(16, -38, 18, -32); ctx.quadraticCurveTo(14, -28, 8, -30); ctx.closePath(); ctx.fill(); ctx.stroke();

            // --- DRAW BODY ---
            let bodyExt = 10;
            ctx.strokeStyle = secondary;

            ctx.lineWidth = bodyExt;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath(); ctx.moveTo(0, -15); ctx.lineTo(0, 5); ctx.stroke(); // Torso

            // Chest detail - Spider logic
            ctx.strokeStyle = primary; ctx.lineWidth = 8;
            ctx.beginPath(); ctx.moveTo(0, -15); ctx.lineTo(0, -2); ctx.stroke();

            // --- DRAW LIMBS ---
            let legTop = secondary;
            let legBot = primary; // Boots
            let armTop = secondary;
            let armBot = primary;

            if (state === 'run' || state === 'idle') {
                let swing = (state === 'idle') ? 0 : Math.sin(frame * 0.6) * 18;
                // Legs
                ctx.strokeStyle = legTop;
                ctx.beginPath(); ctx.moveTo(0, 5); ctx.lineTo(-swing * 0.7, 15); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, 5); ctx.lineTo(swing * 0.7, 15); ctx.stroke();
                // Boots
                ctx.strokeStyle = legBot;
                ctx.beginPath(); ctx.moveTo(-swing * 0.7, 15); ctx.lineTo(-swing, 22); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(swing * 0.7, 15); ctx.lineTo(swing, 22); ctx.stroke();

                // Arms
                ctx.lineWidth = 6;
                ctx.strokeStyle = armTop;
                ctx.beginPath(); ctx.moveTo(0, -10); ctx.lineTo(swing * 0.6, -5); ctx.stroke();
                ctx.strokeStyle = armBot;
                ctx.beginPath(); ctx.moveTo(swing * 0.6, -5); ctx.lineTo(swing * 0.9 + 5, -2); ctx.stroke();

            } else if (state === 'jump' || state === 'fall') {
                // Tucked pose
                ctx.strokeStyle = legTop;
                ctx.beginPath(); ctx.moveTo(0, 5); ctx.lineTo(-12, 10); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, 5); ctx.lineTo(12, 10); ctx.stroke();
                ctx.strokeStyle = legBot;
                ctx.beginPath(); ctx.moveTo(-12, 10); ctx.lineTo(-15, 18); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(12, 10); ctx.lineTo(15, 18); ctx.stroke();

                ctx.lineWidth = 6;
                ctx.strokeStyle = armBot;
                ctx.beginPath(); ctx.moveTo(0, -10); ctx.lineTo(15, -25); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, -10); ctx.lineTo(-15, -25); ctx.stroke();

            } else if (state === 'swing') {
                ctx.lineWidth = 6;
                ctx.strokeStyle = armTop;
                ctx.beginPath(); ctx.moveTo(0, -10); ctx.lineTo(10, -20); ctx.stroke();
                ctx.strokeStyle = armBot;
                ctx.beginPath(); ctx.moveTo(10, -20); ctx.lineTo(15, -30); ctx.stroke(); // Reaching arm

                ctx.strokeStyle = armBot;
                ctx.beginPath(); ctx.moveTo(0, -10); ctx.lineTo(-10, 0); ctx.stroke(); // Down arm

                ctx.lineWidth = bodyExt;
                ctx.strokeStyle = legTop;
                ctx.beginPath(); ctx.moveTo(0, 5); ctx.lineTo(-15, 8); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, 5); ctx.lineTo(-5, 14); ctx.stroke();
                ctx.strokeStyle = legBot;
                ctx.beginPath(); ctx.moveTo(-15, 8); ctx.lineTo(-25, 10); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(-5, 14); ctx.lineTo(-12, 22); ctx.stroke();
            }

            ctx.restore();
        }

        function draw() {
            ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);

            // Dark Night Sky gradient
            let grd = ctx.createLinearGradient(0, 0, 0, CANVAS_H);
            grd.addColorStop(0, '#020111'); // very dark blue
            grd.addColorStop(0.6, '#20124d'); // dark purple
            grd.addColorStop(1, '#000022'); // dark blue at horizon
            ctx.fillStyle = grd;
            ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

            // Draw Stars
            ctx.fillStyle = '#fff';
            stars.forEach(s => {
                let currentAlpha = 0.5 + Math.sin(frameCount * s.blinkSpeed) * 0.5;
                ctx.globalAlpha = currentAlpha;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;

            // Moon
            ctx.fillStyle = '#fdf5e6';
            ctx.beginPath();
            ctx.arc(CANVAS_W - 100, 100, 40, 0, Math.PI * 2);
            ctx.fill();
            // Moon craters (stylized)
            ctx.fillStyle = 'rgba(0,0,0,0.1)';
            ctx.beginPath(); ctx.arc(CANVAS_W - 110, 90, 8, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(CANVAS_W - 80, 110, 12, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(CANVAS_W - 105, 120, 6, 0, Math.PI * 2); ctx.fill();


            // Parallax Background Buildings
            let drawBuildings = (buildings, parallaxSpeed) => {
                buildings.forEach(b => {
                    let pX = (b.x - cameraX * parallaxSpeed) % 2000;
                    if (pX < -b.w) b.x += 2000;

                    ctx.fillStyle = b.color;
                    ctx.fillRect(pX, CANVAS_H - b.h, b.w, b.h);

                    if (b.hasWindows) {
                        b.windows.forEach(w => {
                            ctx.fillStyle = w.color;
                            ctx.globalAlpha = 0.7;
                            ctx.fillRect(pX + w.x, CANVAS_H - b.h + w.y, 8, 12);
                        });
                        ctx.globalAlpha = 1.0;
                    }
                });
            };

            drawBuildings(bgBuildings, 0.1);
            drawBuildings(midBuildings, 0.3);

            ctx.save();
            ctx.translate(-Math.floor(cameraX), 0);

            // Draw Cranes (Anchors)
            anchors.forEach(a => {
                // Draw Crane Tower
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 10;
                ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(a.x, CANVAS_H); ctx.stroke();

                // Crane Arm
                ctx.strokeStyle = '#444';
                ctx.lineWidth = 6;
                ctx.beginPath(); ctx.moveTo(a.x - 50, a.y); ctx.lineTo(a.x + 150, a.y - 20); ctx.stroke();

                // Anchor point highlight
                ctx.fillStyle = '#e23636';
                ctx.beginPath(); ctx.arc(a.x, a.y, 6, 0, Math.PI * 2); ctx.fill();
            });

            // Coins
            coins.forEach(c => {
                if (!c.collected) {
                    ctx.fillStyle = c.type === 'gold' ? '#f1c40f' : '#bdc3c7';
                    ctx.beginPath();
                    ctx.arc(c.x, c.y, c.type === 'gold' ? 12 : 10, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = c.type === 'gold' ? '#d35400' : '#7f8c8d';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    // Glint
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(c.x - 3, c.y - 5, 4, 4);
                }
            });

            // Foreground Roofs
            roofs.forEach(r => {
                // Roof Body
                ctx.fillStyle = '#111'; // Very dark
                ctx.fillRect(r.x, r.y, r.w, CANVAS_H - r.y);

                if (r.windows) {
                    ctx.fillStyle = '#222';
                    // draw dark windows first
                    for (let wy = r.y + 40; wy < CANVAS_H; wy += 50) {
                        for (let wx = r.x + 20; wx < r.x + r.w - 20; wx += 40) {
                            ctx.fillRect(wx, wy, 15, 25);
                        }
                    }
                    // draw lit windows
                    r.windows.forEach(w => {
                        ctx.fillStyle = w.color;
                        ctx.globalAlpha = 0.8;
                        ctx.fillRect(r.x + w.x, r.y + w.y, 15, 25);
                    });
                    ctx.globalAlpha = 1.0;
                }

                // Ledge highlight
                let grad = ctx.createLinearGradient(r.x, r.y, r.x, r.y + 15);
                grad.addColorStop(0, '#333');
                grad.addColorStop(1, '#111');
                ctx.fillStyle = grad;
                ctx.fillRect(r.x, r.y, r.w, 15);
                ctx.strokeStyle = '#000';
                ctx.strokeRect(r.x, r.y, r.w, 15);

                // AC Units
                if (r.acUnits) {
                    r.acUnits.forEach(ac => {
                        ctx.fillStyle = '#555';
                        ctx.fillRect(r.x + ac.x, r.y - ac.h, ac.w, ac.h);
                        ctx.strokeStyle = '#222';
                        ctx.lineWidth = 1;
                        ctx.strokeRect(r.x + ac.x, r.y - ac.h, ac.w, ac.h);
                    });
                }

            });

            // Player
            drawCharacter(player.x, player.y, player.state, frameCount);

            if (mj) {
                ctx.save();
                ctx.translate(mj.x, mj.y);
                ctx.scale(-1, 1); // Face left
                drawMJ(0, 0, mj.state, frameCount);
                ctx.restore();
            }

            if (gameState === 'VICTORY') {
                let midX = (player.x + mj.x) / 2;
                let scale = 1 + Math.sin(frameCount * 0.1) * 0.3; // Beating heart effect
                
                ctx.save();
                ctx.translate(midX - 10, player.y - 80);
                ctx.scale(scale, scale);
                ctx.fillStyle = '#e23636';
                ctx.font = '50px Arial';
                ctx.fillText('❤️', -25, 0);
                ctx.restore();
            }

            ctx.restore();
        }
        function drawMJ(x, y, state, frame) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(0.8, 0.8);
            let swing = (state === 'run') ? Math.sin(frame * 0.3) * 15 : 0;
            
            // Legs (dark pants)
            ctx.lineWidth = 10;
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#2d3436';
            ctx.beginPath(); ctx.moveTo(0, 5); ctx.lineTo(-swing * 0.7, 15); ctx.lineTo(-swing, 22); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, 5); ctx.lineTo(swing * 0.7, 15); ctx.lineTo(swing, 22); ctx.stroke();
            
            // Body (white shirt, black jacket)
            ctx.lineWidth = 14;
            ctx.strokeStyle = '#111'; // Jacket
            ctx.beginPath(); ctx.moveTo(0, -15); ctx.lineTo(0, 8); ctx.stroke();
            
            ctx.lineWidth = 6;
            ctx.strokeStyle = '#ecf0f1'; // Shirt
            ctx.beginPath(); ctx.moveTo(0, -15); ctx.lineTo(0, 5); ctx.stroke();

            // Head (skin)
            ctx.fillStyle = '#d2b48c'; 
            ctx.beginPath(); ctx.arc(0, -30, 13, 0, Math.PI * 2); ctx.fill();
            
            // Big curly hair (brown)
            ctx.fillStyle = '#5c3a21'; 
            ctx.beginPath();
            ctx.arc(0, -35, 18, Math.PI, Math.PI * 2);
            ctx.arc(-15, -25, 13, 0, Math.PI * 2);
            ctx.arc(15, -25, 13, 0, Math.PI * 2);
            ctx.fill();

            // Arms
            ctx.lineWidth = 7;
            ctx.strokeStyle = '#111';
            ctx.beginPath(); ctx.moveTo(0, -10); ctx.lineTo(swing * 0.5, -5); ctx.lineTo(swing, 5); ctx.stroke();
            
            ctx.restore();
        }

        initMenu();
    </script>
</body>
