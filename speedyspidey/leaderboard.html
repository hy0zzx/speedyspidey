<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPEEDY SPIDEY - LEADERBOARD</title>
    <link rel="stylesheet" href="leaderboard.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="leaderboard-wrapper">
        <header>
            <div class="logo">SPEEDY SPIDEY</div>
            <div class="title">HALL OF FAME</div>
            <button id="home-btn" onclick="location.href='index.html'">MAIN MENU</button>
        </header>
        
        <div class="table-header">
            <span class="col-rank">RANK</span>
            <span class="col-avatar"></span>
            <span class="col-name">PLAYER</span>
            <span class="col-score">SCORE(COINS)</span>
        </div>
        
        <div id="leaderboard-list">
            <div class="loading">로딩 중...</div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://pothmutwfjlrgmxzfklx.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_jf92vAyGsH10dRZgBf8V7Q_siJqQ_HB';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function fetchLeaderboard() {
            const listContainer = document.getElementById('leaderboard-list');
            try {
                const { data, error } = await supabaseClient
                    .from('leaderboard')
                    .select('*')
                    .order('score', { ascending: false })
                    .limit(100);

                if (error) throw error;

                listContainer.innerHTML = '';
                
                if (data.length === 0) {
                    listContainer.innerHTML = '<div class="empty">아직 등록된 랭킹이 없습니다.</div>';
                    return;
                }

                data.forEach((row, index) => {
                    const rank = index + 1;
                    const el = document.createElement('div');
                    el.className = 'leaderboard-row' + (rank <= 3 ? ` top-${rank}` : '');
                    
                    let rankHtml = `<span class="col-rank">${rank}</span>`;
                    if (rank === 1) rankHtml = `<span class="col-rank">🏆 1</span>`;
                    else if (rank === 2) rankHtml = `<span class="col-rank">🥈 2</span>`;
                    else if (rank === 3) rankHtml = `<span class="col-rank">🥉 3</span>`;

                    el.innerHTML = `
                        ${rankHtml}
                        <span class="col-avatar"><div class="avatar-circle"></div></span>
                        <span class="col-name">${row.username}</span>
                        <span class="col-score">${row.score}</span>
                    `;
                    listContainer.appendChild(el);
                });
            } catch (err) {
                console.error(err);
                listContainer.innerHTML = `<div class="error">에러: ${err.message}<br><small>(Supabase RLS 설정이나 데이터를 확인해주세요)</small></div>`;
            }
        }

        fetchLeaderboard();
    </script>
</body>
</html>
